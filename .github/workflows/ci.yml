name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Quarkus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desafio-backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: desafio
          POSTGRES_PASSWORD: desafio123
          POSTGRES_DB: desafio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desafio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Executa a suíte completa: unitários (Mockito) + @QuarkusTest
      # (integração REST com banco dedicado) via surefire.
      - name: Build and run tests (unit + Quarkus integration)
        env:
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/desafio
          QUARKUS_DATASOURCE_USERNAME: desafio
          QUARKUS_DATASOURCE_PASSWORD: desafio123
        run: ./mvnw -B clean verify -DskipITs

  frontend:
    name: Frontend (Angular/Nx)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desafio-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desafio-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx nx build frontend

      - name: Test
        run: npx nx test frontend