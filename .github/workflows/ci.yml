name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Quarkus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desafio-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run unit tests
        run: ./mvnw -B clean verify -DskipITs

  frontend:
    name: Frontend (Angular/Nx)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desafio-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desafio-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx nx build frontend

      - name: Test
        run: npx nx test frontend