# ============================================================
# application.properties - Desafio Backend (Quarkus 3.39.1)
# ============================================================

# ---------- Aplicação ----------
quarkus.application.name=desafio-backend
quarkus.http.port=8080

# ---------- Banco de Dados (PostgreSQL) ----------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/desafio}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:desafio}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:desafio123}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2

# ---------- Hibernate ORM / Panache ----------
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# ---------- OIDC / Keycloak ----------
quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/desafio}
quarkus.oidc.client-id=backend
quarkus.oidc.credentials.secret=backend-secret-123456
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=account
quarkus.oidc.roles.role-claim-path=realm_access.roles

# ---------- CORS (Angular localhost:4200) ----------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,info

# ---------- OpenAPI / Swagger ----------
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true

# ---------- Logging ----------
quarkus.log.level=INFO
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.console.enabled=true

# ---------- Dev ----------
%dev.quarkus.hibernate-orm.schema-management.strategy=update