# ============================================================
# Configuração apenas de teste (classpath de teste)
# Sobrescreve application.properties durante @QuarkusTest.
# ============================================================

# Banco dedicado (não destrói o seed de desenvolvimento do banco "desafio").
# No CI a variável QUARKUS_DATASOURCE_JDBC_URL (ordem mais alta) aponta para
# o service postgres; localmente o banco "desafio_test" é criado pelo init.sql.
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/desafio_test
quarkus.datasource.username=desafio
quarkus.datasource.password=desafio123

# Schema recriado a cada boot de teste; seed feito programaticamente (TestDataSeeder).
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file

# Porta de teste fixa para não conflitar com Keycloak (8081) no mesmo host.
quarkus.http.test-port=18081

# OIDC desligado nos testes: identidade simulada via @TestSecurity.
quarkus.oidc.enabled=false
