services:
  postgres:
    image: postgres:15-alpine
    container_name: desafio-postgres
    environment:
      POSTGRES_DB: desafio
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d desafio"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - desafio-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: desafio-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: desafio
      KC_DB_PASSWORD: desafio123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # URL pública do Keycloak (host). Sem isso o issuer vira http://localhost
      # (porta 80) e o backend Quarkus não consegue validar tokens.
      KC_HOSTNAME_URL: http://localhost:8081
      KC_HTTP_PORT: 8081
      KC_PROXY: edge
    ports:
      - "8081:8081"
    volumes:
      - ../desafio-keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /realms/desafio HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - desafio-net

  backend:
    build:
      context: ../desafio-backend
      dockerfile: Dockerfile
    container_name: desafio-backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/desafio
      QUARKUS_DATASOURCE_USERNAME: desafio
      QUARKUS_DATASOURCE_PASSWORD: desafio123
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8081/realms/desafio
      QUARKUS_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - desafio-net

  frontend:
    build:
      context: ../desafio-frontend
      dockerfile: Dockerfile
    container_name: desafio-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - desafio-net

networks:
  desafio-net:
    driver: bridge

volumes:
  postgres_data: